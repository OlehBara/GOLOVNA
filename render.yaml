services:
  - type: web
    name: finsmart-web
    env: python
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT finsmart_project.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "finsmart-s9ty.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://finsmart-s9ty.onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "finsmart_project.settings"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
